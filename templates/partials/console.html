<div class="console" data-console="ecommerce">
  <div class="console__head">
    <span class="console__live mono"><i class="dot" aria-hidden="true"></i> LIVE</span>
    <div class="console__who">
      <strong class="mono" data-console-target>shop.esempio.it</strong>
      <small data-console-mode>Campagna di test · black-box</small>
    </div>
    <span class="widget__tag mono">DEMO</span>
  </div>
  <div class="console__sev mono" aria-hidden="true">
    <span class="sev sev--crit"><b data-sev="crit">0</b>Critiche</span>
    <span class="sev sev--high"><b data-sev="high">0</b>Alte</span>
    <span class="sev sev--med"><b data-sev="med">0</b>Medie</span>
    <span class="sev sev--low"><b data-sev="low">0</b>Basse</span>
  </div>
  <div class="console__log mono" data-console-log aria-hidden="true"></div>
  <div class="console__foot mono" aria-hidden="true">
    <span><i class="console__spin"></i> <span data-console-agents>agenti in attesa</span></span>
    <span data-console-time>00:00:00</span>
  </div>
  <p class="sr-only">Esempio animato di una campagna di penetration test: gli agenti mappano il sito, provano gli attacchi e segnalano le vulnerabilità dimostrate con gravità e prova di sfruttamento.</p>
</div>
