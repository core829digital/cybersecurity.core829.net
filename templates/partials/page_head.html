<section class="phead" aria-labelledby="page-title">
  <div class="phead__grid" aria-hidden="true"></div>
  <div class="phead__glow" aria-hidden="true"></div>
  <div class="wrap phead__inner">
    <nav class="crumbs mono" aria-label="Percorso">
      <a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">{{ c.name }}</span>
    </nav>
    <p class="label mono">// {{ eyebrow }}</p>
    <h1 class="phead__title" id="page-title" data-scramble>{{ title }}<br><span class="accent">{{ accent }}</span></h1>
    <p class="phead__lead">{{ lead }}</p>
  </div>
</section>
